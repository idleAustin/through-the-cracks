name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '17 6,10,14,18,22 * * 0,4'
    - cron: '17 2,6,10,14,18,22 * * 1,5'
  workflow_dispatch:

permissions: {}

jobs:
  check-refresh:
    name: Check Refresh Needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.non_schedule.outputs.should_run || steps.schedule_check.outputs.should_run || 'false' }}
      reason: ${{ steps.non_schedule.outputs.reason || steps.schedule_check.outputs.reason || 'unknown' }}
    steps:
      - name: Skip Check for Non-Scheduled Events
        id: non_schedule
        if: github.event_name != 'schedule'
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=${GITHUB_EVENT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Checkout Preflight Files
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: github.event_name == 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate Blogger & Production Freshness
        id: schedule_check
        if: github.event_name == 'schedule'
        run: |
          git fetch --depth=1 origin +refs/heads/data-snapshot:refs/remotes/origin/data-snapshot >/dev/null 2>&1 || true
          RESULT=$( (git show origin/data-snapshot:public/data/overview.json 2>/dev/null || cat public/data/overview.json) | node scripts/check-refresh-needed.js --stdin-snapshot )
          echo "Refresh check result: $RESULT"
          SHOULD_RUN=$(echo "$RESULT" | jq -r '.shouldRun')
          REASON=$(echo "$RESULT" | jq -r '.reason')
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

  validate:
    name: Lint, Security & Build Test
    needs: check-refresh
    if: needs.check-refresh.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Run Unit Tests
        run: npm run test:unit
      - name: Build Production Bundle
        run: npm run build
      - name: Snyk Dependency Vulnerability Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Build Docker Container
        run: docker build -t through-the-cracks .
      - name: Snyk Container Image Scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: through-the-cracks

  refresh-archive:
    name: Refresh Archive Snapshot
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Latest Data Snapshot
        run: |
          if git fetch origin +refs/heads/data-snapshot:refs/remotes/origin/data-snapshot >/dev/null 2>&1; then
            SNAP_DATE=$(git show origin/data-snapshot:public/data/overview.json 2>/dev/null | jq -r '.dateRange.latest // ""' || echo "")
            CUR_DATE=$(jq -r '.dateRange.latest // ""' public/data/overview.json 2>/dev/null || echo "")
            if [[ -n "$SNAP_DATE" && ( -z "$CUR_DATE" || ! "$SNAP_DATE" < "$CUR_DATE" ) ]]; then
              git checkout origin/data-snapshot -- public/data/
            fi
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: npm ci
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Run Incremental Archive Ingest
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ] && doppler --no-check-version secrets download --no-file --format env >/dev/null 2>&1; then
            doppler --no-check-version run -- node scripts/ingest.js --incremental --skip-bq
          else
            node scripts/ingest.js --incremental --skip-bq
          fi
      - name: Refresh Song Metadata & Atlas
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ] && doppler --no-check-version secrets download --no-file --format env >/dev/null 2>&1; then
            doppler --no-check-version run -- node scripts/sync-metadata-r2.js pull
            if [ -f ".cache/song-metadata/checkpoint.jsonl" ]; then
              node scripts/prepare-song-metadata-input.js
              doppler --no-check-version run -- python3 scripts/discover-song-metadata.py --pass=all --sources=mb,discogs,wiki --workers=2 --limit-songs=150
              python3 scripts/reconcile-song-metadata.py
              python3 scripts/build-metadata-atlas.py
              doppler --no-check-version run -- node scripts/sync-metadata-r2.js push-checkpoint
              doppler --no-check-version run -- node scripts/sync-metadata-r2.js push-atlas --bump-manifest
            else
              echo "::warning::Skipping metadata discovery because R2 state/song-metadata/checkpoint.jsonl.gz is not seeded yet."
            fi
          else
            echo "::warning::Skipping metadata discovery because DOPPLER_TOKEN is unavailable."
          fi
      - name: Persist Archive Snapshot Branch
        run: |
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B data-snapshot
            git add public/data/
            git commit -m "chore(data): refresh archive snapshot"
            git push --force origin data-snapshot
          fi

  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    needs: refresh-archive
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Latest Data Snapshot
        run: |
          if git fetch origin +refs/heads/data-snapshot:refs/remotes/origin/data-snapshot >/dev/null 2>&1; then
            SNAP_DATE=$(git show origin/data-snapshot:public/data/overview.json 2>/dev/null | jq -r '.dateRange.latest // ""' || echo "")
            CUR_DATE=$(jq -r '.dateRange.latest // ""' public/data/overview.json 2>/dev/null || echo "")
            if [[ -n "$SNAP_DATE" && ( -z "$CUR_DATE" || ! "$SNAP_DATE" < "$CUR_DATE" ) ]]; then
              git checkout origin/data-snapshot -- public/data/
            fi
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Production Bundle
        run: npm run build
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Deploy Worker & Sync Secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN secret is required for Cloudflare Workers deployment."
            exit 1
          fi
          doppler --no-check-version run -- npx --no-install wrangler deploy
          doppler --no-check-version run -- node -e "const { execFileSync } = require('node:child_process'); const put = (k) => execFileSync('npx', ['--no-install', 'wrangler', 'secret', 'put', k], { input: process.env[k], stdio: ['pipe', 'inherit', 'inherit'] }); for (const key of ['BLOGGER_API_KEY', 'BLOGGER_BLOG_ID', 'INGEST_SECRET']) { if (!process.env[key]) throw new Error('Missing Doppler secret: ' + key); put(key); } for (const key of ['YOUTUBE_API_KEY']) { if (process.env[key]) put(key); }"
      - name: Trigger Production D1 & R2 Refresh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler --no-check-version run -- node --input-type=module - <<'EOF'
          const secret = (process.env.INGEST_SECRET || '').trim();
          if (!secret) throw new Error('Missing INGEST_SECRET');
          const base = 'https://idleamericana.com/through-the-cracks/api';
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          await sleep(3000);

          let ingestRes = null;
          for (let attempt = 1; attempt <= 2; attempt += 1) {
            let res = null;
            try {
              res = await fetch(`${base}/ingest`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${secret}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ incremental: true, resolveLinks: true, awaitSync: true }),
              });
            } catch (err) {
              if (attempt === 2) throw err;
              await sleep(5000);
              continue;
            }
            if (res.ok) {
              ingestRes = await res.json();
              break;
            }
            const errText = await res.text().catch(() => '');
            const err = new Error(`POST /api/ingest failed (${res.status}): ${errText.slice(0, 300)}`);
            if (res.status < 500 || attempt === 2) throw err;
            await sleep(5000);
          }
          console.log('Ingest & R2 sync summary:', JSON.stringify({
            mode: ingestRes?.mode,
            fetchedPosts: ingestRes?.fetchedPosts,
            episodesUpserted: ingestRes?.episodesUpserted,
            episodesUnchanged: ingestRes?.episodesUnchanged,
            latestAirDate: ingestRes?.latestAirDate,
            linkResolution: ingestRes?.linkResolution,
            r2Sync: ingestRes?.r2Sync,
          }));

          const ovRes = await fetch(`${base}/overview`);
          if (!ovRes.ok) throw new Error(`GET /api/overview failed (${ovRes.status})`);
          const ov = await ovRes.json();
          if (!ov?.totalEpisodes || !ov?.dateRange?.latest) {
            throw new Error(`GET /api/overview returned incomplete payload: ${JSON.stringify(ov).slice(0, 300)}`);
          }
          console.log('Verified /api/overview:', JSON.stringify({
            totalEpisodes: ov.totalEpisodes,
            totalSongPlays: ov.totalSongPlays,
            latestEpisodeId: ov.latestEpisodeId,
            dateRange: ov.dateRange,
          }));

          const atlasRes = await fetch(`${base}/atlas`);
          if (!atlasRes.ok) throw new Error(`GET /api/atlas failed (${atlasRes.status})`);
          const atlas = await atlasRes.json();
          if (!atlas?.summary?.totalSongs) {
            throw new Error('GET /api/atlas returned missing summary');
          }
          console.log('Verified /api/atlas:', JSON.stringify({
            totalSongs: atlas.summary.totalSongs,
            songsWithYear: atlas.summary.songsWithYear,
          }));
          EOF

  release:
    name: Tag Release & Publish Notes
    needs: deploy-cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag Release & Publish Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node scripts/version.mjs --notes notes.md)"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION already released; deployed commit ${GITHUB_SHA::7}."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
