<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        var VALID = { system: 1, light: 1, dark: 1 };
        var pref = null;
        try {
          var stored = localStorage.getItem('as-theme');
          if (stored && VALID[stored]) {
            pref = stored;
          } else {
            var legacy = localStorage.getItem('ttc-theme');
            if (legacy === 'light' || legacy === 'dark') {
              pref = legacy;
              localStorage.setItem('as-theme', legacy);
            }
          }
          if (localStorage.getItem('ttc-theme') !== null) {
            localStorage.removeItem('ttc-theme');
          }
        } catch (e) {}

        var resolvedPref = pref || 'system';
        var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var resolvedTheme = resolvedPref === 'system' ? (isLight ? 'light' : 'dark') : resolvedPref;
        document.documentElement.dataset.theme = resolvedTheme;

        if (resolvedPref === 'light' || resolvedPref === 'dark') {
          var color = resolvedTheme === 'light' ? '#f4f4f6' : '#0a0a0c';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', color);
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Through the Cracks — WEVL 89.9 FM Playlist Archive & Analytics</title>
    <meta name="description" content="Explore 13+ years of radio playlist archives, artist stats, and song analytics for WEVL 89.9 FM's Through the Cracks program hosted by Ed Dirmeyer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Geist:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
